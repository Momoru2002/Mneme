name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck web
        run: pnpm --filter @mneme/web typecheck

      - name: Test web
        run: pnpm --filter @mneme/web test

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # The Rust core embeds apps/web/dist at compile time (RustEmbed), so the
      # web frontend must be built before cargo test / clippy.
      - name: Build web frontend
        run: pnpm --filter @mneme/web build

      # Channel must match rust-toolchain.toml (currently 1.92.0).
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Test
        shell: bash
        run: |
          set +e
          cargo test 2>&1 | tee /tmp/test-output.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            # Surface the failure as a check-run annotation (visible via the
            # REST API even when raw job logs aren't reachable) — grab the
            # tail, since annotation bodies are size-limited, and %0A-encode
            # newlines per the workflow-command format. Pure bash (no awk —
            # not guaranteed present in Git Bash on windows-latest).
            encoded=""
            while IFS= read -r line; do
              encoded="${encoded}${line}%0A"
            done < <(tail -c 3000 /tmp/test-output.txt)
            echo "::error::${encoded}"
            exit "$code"
          fi
        working-directory: apps/desktop/src-tauri

      - name: Clippy
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/clippy-output.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            encoded=""
            while IFS= read -r line; do
              encoded="${encoded}${line}%0A"
            done < <(tail -c 3000 /tmp/clippy-output.txt)
            echo "::error::${encoded}"
            exit "$code"
          fi
