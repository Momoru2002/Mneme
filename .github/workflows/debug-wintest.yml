name: Debug Windows test failure
on:
  push:
    branches: [debug-wintest]
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'
      - run: pnpm install
      - run: pnpm --filter @mneme/web build
      - name: Stage placeholder
        shell: bash
        run: bash scripts/prepare-sidecar.sh --placeholder
      - name: Test (instrumented)
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          cargo test --workspace -- --test-threads=1 > test.log 2>&1
          echo "exit=$?" >> test.log
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: apps/desktop/src-tauri/test.log
