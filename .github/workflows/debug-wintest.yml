name: Debug Windows test failure
on:
  push:
    branches: [debug-wintest]
permissions:
  contents: write
jobs:
  win:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'
      - run: pnpm install
      - run: pnpm --filter @mneme/web build
      - name: Stage placeholder
        shell: bash
        run: bash scripts/prepare-sidecar.sh --placeholder
      - name: Test
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          set +e
          cargo test --workspace > test.log 2>&1
          code=$?
          printf 'job %s exit=%s\n' "${{ matrix.n }}" "$code" > header.txt
          cat header.txt test.log > out.log
          exit 0
      - name: Post result
        shell: bash
        working-directory: apps/desktop/src-tauri
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if grep -q "exit=0" header.txt; then
            printf 'job %s exit=0 (PASS)' "${{ matrix.n }}" > out.log
          fi
          python ../../../scripts/debug_post_log.py out.log
          curl -s -o response.json -w "%{http_code}\n" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d @comment_body.json \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"
          exit 0
