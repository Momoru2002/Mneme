name: Debug Windows test failure
on:
  push:
    branches: [debug-wintest]
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'
      - run: pnpm install
      - run: pnpm --filter @mneme/web build
      - name: Stage placeholder
        shell: bash
        run: bash scripts/prepare-sidecar.sh --placeholder
      - name: Run tests (repeat until a failure or 5 attempts)
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          for i in 1 2 3 4 5; do
            echo "=== attempt $i ==="
            cargo test --workspace -- --test-threads=1 > "test-$i.log" 2>&1
            code=$?
            echo "attempt $i exit=$code" | tee -a summary.txt
            if [ $code -ne 0 ]; then
              cp "test-$i.log" test.log
              echo "$i" > failed_attempt.txt
              break
            fi
          done
        continue-on-error: true
      - name: Post result as a commit comment
        if: always()
        shell: bash
        working-directory: apps/desktop/src-tauri
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f test.log ]; then
            src=test.log
          else
            src=summary.txt
          fi
          python ../../../scripts/debug_post_log.py "$src"
          http_code=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d @comment_body.json \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments")
          echo "post http_code: $http_code"
          cat response.json
