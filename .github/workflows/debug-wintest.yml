name: Debug Windows test failure
on:
  push:
    branches: [debug-wintest]
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'
      - run: pnpm install
      - run: pnpm --filter @mneme/web build
      - name: Stage placeholder
        shell: bash
        run: bash scripts/prepare-sidecar.sh --placeholder
      - name: Test and post result as a commit comment
        shell: bash
        working-directory: apps/desktop/src-tauri
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo test --workspace -- --test-threads=1 > test.log 2>&1
          code=$?
          echo "exit=$code" >> test.log
          python -c "
          import json, re
          t = open('test.log', errors='replace').read()
          t = re.sub(r'\x1b\[[0-9;]*m', '', t).replace('\r', '')
          body = '\`\`\`\n' + t[-60000:] + '\n\`\`\`'
          json.dump({'body': body}, open('comment.json', 'w'))
          "
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d @comment.json \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"
          exit $code
